permissions: read-all

name: Scheduled automation

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight UTC
  workflow_dispatch:  # Allow manual triggering

jobs:
  daily-snapshot:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Install uv
      uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync

    - name: Install Playwright browser
      run: uv run playwright install chromium --with-deps

    - name: Take follower snapshot
      env:
        LETTERBOXD_USERNAME: ${{ secrets.LETTERBOXD_USERNAME }}
        LETTERBOXD_PASSWORD: ${{ secrets.LETTERBOXD_PASSWORD }}
        HEADLESS: "true"
      run: |
        uv run python -m src.growth.tracker

    - name: Update trending films cache
      env:
        LETTERBOXD_USERNAME: ${{ secrets.LETTERBOXD_USERNAME }}
        LETTERBOXD_PASSWORD: ${{ secrets.LETTERBOXD_PASSWORD }}
        HEADLESS: "true"
      run: |
        uv run python -m src.growth.trending --update
