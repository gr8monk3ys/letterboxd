name: org-osv

on:
  workflow_dispatch:
  schedule:
    - cron: "23 11 18 * *"  # monthly (minute-safe policy)

# The shared reusable-osv workflow (and Google's osv-scanner-reusable under it)
# declares security-events: write. A caller that grants only read-all fails at
# startup before any step runs -- every scheduled run since 2026-08 did.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  osv:
    uses: gr8monk3ys/org-workflows/.github/workflows/reusable-osv.yml@2659a9a32c4e6e3858f69a2f502210941a886d5a
