<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>{% block title %}Letterboxd Dashboard{% endblock %}</title>
    <style>
        /* ---------------------------------------------------------------
           Tokens.

           Named by ROLE, not by value. --accent-ink means "text that sits
           on an accent fill"; it is not interchangeable with --bg-color,
           and reusing one for the other is what made every light-mode
           button unreadable.
           --------------------------------------------------------------- */
        :root {
            /* dark is the default: this is a film app, and Letterboxd is dark */
            --bg: #101418;
            --bg-sunken: #0b0e11;
            --surface: #171d23;
            --surface-raised: #1e262e;
            --line: #2a343d;
            --line-soft: #212a32;

            --ink: #f2f6f9;          /* primary text */
            --ink-dim: #93a4b3;      /* secondary text  — 7.5:1 on --bg */
            --ink-faint: #6b7c8b;    /* tertiary        — decorative only */

            --accent: #00e054;       /* Letterboxd green — 10:1 on --bg */
            --accent-soft: rgba(0, 224, 84, 0.12);
            --accent-ink: #04220f;   /* text on an accent fill */
            --orange: #ff8000;
            --orange-soft: rgba(255, 128, 0, 0.12);
            --blue: #40bcf4;
            --danger: #ff5763;

            --star: #f5c518;         /* ratings read as gold, not as body text */

            /* Spacing scale — every margin/padding comes from here */
            --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
            --s5: 24px; --s6: 32px; --s7: 48px; --s8: 72px;

            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 1px 2px rgba(0,0,0,.28), 0 8px 24px -12px rgba(0,0,0,.5);

            --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* A display serif costs nothing (all system faces) and moves the
               whole page from "admin console" to "film almanac". */
            --serif: ui-serif, 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
            --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, monospace;

            --ease: cubic-bezier(.2, .7, .3, 1);

            /* Legacy aliases: older templates still reference these names. */
            --bg-color: var(--bg);
            --card-bg: var(--surface);
            --text-color: var(--ink-dim);
            --text-bright: var(--ink);
            --border-color: var(--line);
            --log-bg: var(--bg-sunken);
            --accent-orange: var(--orange);
        }

        /* Light palette, declared once as a reusable block. */
        @media (prefers-color-scheme: light) {
            :root:not([data-theme="dark"]) {
                --bg: #f6f7f8;
                --bg-sunken: #eceef0;
                --surface: #ffffff;
                --surface-raised: #ffffff;
                --line: #dfe3e7;
                --line-soft: #eaedf0;

                --ink: #11171c;
                --ink-dim: #55636f;
                --ink-faint: #8896a2;

                /* #00e054 is ~1.7:1 on white and unreadable. This is 5.5:1. */
                --accent: #007a33;
                --accent-soft: rgba(0, 122, 51, 0.10);
                --accent-ink: #ffffff;
                --orange: #b45700;
                --orange-soft: rgba(180, 87, 0, 0.10);
                --blue: #0b6ea8;
                --danger: #c0303c;
                --star: #b8860b;

                --shadow: 0 1px 2px rgba(16,24,32,.06), 0 8px 24px -14px rgba(16,24,32,.24);
            }
        }

        [data-theme="light"] {
            --bg: #f6f7f8;
            --bg-sunken: #eceef0;
            --surface: #ffffff;
            --surface-raised: #ffffff;
            --line: #dfe3e7;
            --line-soft: #eaedf0;

            --ink: #11171c;
            --ink-dim: #55636f;
            --ink-faint: #8896a2;

            --accent: #007a33;
            --accent-soft: rgba(0, 122, 51, 0.10);
            --accent-ink: #ffffff;
            --orange: #b45700;
            --orange-soft: rgba(180, 87, 0, 0.10);
            --blue: #0b6ea8;
            --danger: #c0303c;
            --star: #b8860b;

            --shadow: 0 1px 2px rgba(16,24,32,.06), 0 8px 24px -14px rgba(16,24,32,.24);
        }

        /* --------------------------------------------------------------- */

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--ink-dim);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .container {
            max-width: 1080px;
            margin: 0 auto;
            /* padding-inline, not the padding shorthand: `main` is also a
               .container, and a shorthand here (specificity 0,1,0) silently
               overrode the vertical padding on `main` (0,0,1), leaving the
               page content flush against the sticky header. */
            padding-inline: var(--s5);
        }

        /* Skip link: the nav is 7 items deep, so keyboard users would
           otherwise tab through it on every page. */
        .skip-link {
            position: absolute;
            left: -9999px;
            top: var(--s2);
            padding: var(--s2) var(--s4);
            background: var(--accent);
            color: var(--accent-ink);
            border-radius: var(--radius-sm);
            font-weight: 600;
            z-index: 100;
        }
        .skip-link:focus { left: var(--s4); }

        /* ---- Header ---------------------------------------------------- */

        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: color-mix(in srgb, var(--bg) 85%, transparent);
            backdrop-filter: saturate(160%) blur(12px);
            -webkit-backdrop-filter: saturate(160%) blur(12px);
            border-bottom: 1px solid var(--line-soft);
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--s4);
            min-height: 60px;
        }

        .logo {
            font-family: var(--serif);
            color: var(--ink);
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            text-decoration: none;
            white-space: nowrap;
        }
        .logo span { color: var(--accent); }

        nav {
            display: flex;
            align-items: center;
            gap: var(--s1);
            overflow-x: auto;
            scrollbar-width: none;
        }
        nav::-webkit-scrollbar { display: none; }

        nav a {
            position: relative;
            color: var(--ink-dim);
            text-decoration: none;
            padding: var(--s2) var(--s3);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            white-space: nowrap;
            transition: color .18s var(--ease), background .18s var(--ease);
        }
        nav a:hover { color: var(--ink); background: var(--line-soft); }
        nav a.active { color: var(--ink); font-weight: 600; }
        /* Underline the current page rather than filling it: the filled
           pill read as a hover state and made "where am I" ambiguous. */
        nav a.active::after {
            content: "";
            position: absolute;
            left: var(--s3);
            right: var(--s3);
            bottom: 2px;
            height: 2px;
            border-radius: 2px;
            background: var(--accent);
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--line);
            color: var(--ink-dim);
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            flex: none;
            transition: color .18s var(--ease), border-color .18s var(--ease);
        }
        .theme-toggle:hover { color: var(--ink); border-color: var(--ink-faint); }

        /* ---- Typography ------------------------------------------------ */

        main { padding-block: var(--s7) var(--s8); }
        /* Anchors and the skip link must clear the sticky header. */
        html { scroll-padding-top: 76px; }

        h1 {
            font-family: var(--serif);
            color: var(--ink);
            font-size: clamp(1.9rem, 1.3rem + 2.2vw, 2.6rem);
            line-height: 1.15;
            letter-spacing: -0.02em;
            font-weight: 600;
        }

        h2 {
            font-family: var(--serif);
            color: var(--ink);
            font-size: 1.4rem;
            line-height: 1.25;
            letter-spacing: -0.01em;
            font-weight: 600;
        }

        h3 {
            color: var(--ink);
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.005em;
            margin-bottom: var(--s4);
        }

        h4 { color: var(--ink); font-size: .95rem; font-weight: 600; }

        /* Small-caps section label. Replaces the old all-caps h3, which
           shouted every card title at the same volume as the page title. */
        .eyebrow {
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--ink-faint);
            margin-bottom: var(--s3);
        }

        .lede {
            font-size: 1.02rem;
            max-width: 62ch;
            color: var(--ink-dim);
        }

        /* Any figure the eye is meant to compare against another figure. */
        .num {
            font-family: var(--serif);
            font-variant-numeric: tabular-nums;
            color: var(--ink);
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .stars { color: var(--star); letter-spacing: .04em; white-space: nowrap; }

        a { color: var(--accent); }

        code, pre, .mono { font-family: var(--mono); font-size: .85em; }

        /* ---- Layout ---------------------------------------------------- */

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: var(--s4);
            margin-bottom: var(--s5);
        }

        .stack > * + * { margin-top: var(--s5); }

        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: var(--s5);
            border: 1px solid var(--line-soft);
            box-shadow: var(--shadow);
        }

        .card > h3:first-child, .card > .eyebrow:first-child { margin-top: 0; }

        /* ---- Stats ----------------------------------------------------- */

        .stat {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: var(--s3);
            padding: var(--s2) 0;
            border-bottom: 1px solid var(--line-soft);
        }
        .stat:last-child { border-bottom: none; }

        .stat-value {
            font-family: var(--serif);
            font-variant-numeric: tabular-nums;
            color: var(--ink);
            font-weight: 600;
        }
        .stat-value.success { color: var(--accent); }
        .stat-value.warning { color: var(--orange); }

        .progress-bar {
            height: 6px;
            background: var(--line-soft);
            border-radius: 999px;
            overflow: hidden;
            margin-top: var(--s2);
        }

        .progress-fill {
            height: 100%;
            border-radius: 999px;
            background: var(--accent);
            transition: width .6s var(--ease);
        }
        .progress-fill.warning { background: var(--orange); }
        .progress-fill.danger { background: var(--danger); }

        /* ---- Tables ---------------------------------------------------- */

        .table-wrap { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; }

        th, td {
            padding: var(--s3);
            text-align: left;
            border-bottom: 1px solid var(--line-soft);
        }
        tr:last-child td { border-bottom: none; }

        th {
            color: var(--ink-faint);
            font-weight: 700;
            font-size: .72rem;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        /* ---- Controls -------------------------------------------------- */

        .btn {
            display: inline-flex;
            align-items: center;
            gap: var(--s2);
            padding: var(--s2) var(--s4);
            background: var(--accent);
            color: var(--accent-ink);
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            text-decoration: none;
            font-family: inherit;
            font-size: .9rem;
            font-weight: 600;
            line-height: 1.5;
            transition: filter .18s var(--ease), transform .18s var(--ease);
        }
        .btn:hover { filter: brightness(1.08); }
        .btn:active { transform: translateY(1px); }

        .btn-secondary {
            background: transparent;
            color: var(--ink);
            border-color: var(--line);
        }
        .btn-secondary:hover { background: var(--line-soft); filter: none; }

        .btn-danger { background: var(--danger); color: #fff; }

        .btn:disabled, .btn[disabled] {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
            filter: none;
        }

        .action-buttons { display: flex; gap: var(--s3); flex-wrap: wrap; }

        /* Exclude checkboxes and radios: giving them a padded, filled box
           turns them into unreadable black squares. */
        input:not([type="checkbox"]):not([type="radio"]), select, textarea {
            font-family: inherit;
            font-size: .9rem;
            padding: var(--s2) var(--s3);
            background: var(--bg-sunken);
            border: 1px solid var(--line);
            color: var(--ink);
            border-radius: var(--radius-sm);
        }

        input[type="checkbox"], input[type="radio"] {
            accent-color: var(--accent);
            width: 1.05em;
            height: 1.05em;
            cursor: pointer;
        }

        /* One visible focus ring for everything focusable. There were none
           at all before, which made the whole UI unusable by keyboard. */
        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: var(--radius-sm);
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--ink-faint);
        }
        .status-indicator.connected { background: var(--accent); }
        .status-indicator.disconnected { background: var(--ink-faint); }

        .pill {
            display: inline-block;
            padding: var(--s1) var(--s3);
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: .8rem;
            font-weight: 600;
        }

        /* ---- Notices --------------------------------------------------- */

        .notice-empty {
            background: var(--surface);
            border: 1px solid var(--line-soft);
            border-left: 3px solid var(--orange);
            border-radius: var(--radius);
            padding: var(--s4) var(--s5);
            margin: 0 0 var(--s5);
            line-height: 1.6;
            box-shadow: var(--shadow);
        }
        .notice-empty strong { color: var(--ink); }
        .notice-cmd {
            display: inline-block;
            margin-top: var(--s3);
            padding: var(--s2) var(--s3);
            background: var(--bg-sunken);
            border-radius: var(--radius-sm);
            color: var(--accent);
            font-family: var(--mono);
            font-size: .82rem;
        }
        .notice-warn { margin-top: var(--s3); font-size: .9rem; }
        .notice-warn a { color: var(--accent); }

        /* ---- Logs ------------------------------------------------------ */

        .log-viewer {
            background: var(--bg-sunken);
            border: 1px solid var(--line-soft);
            border-radius: var(--radius);
            padding: var(--s4);
            font-family: var(--mono);
            font-size: 12px;
            line-height: 1.7;
            max-height: 460px;
            overflow: auto;
        }
        .log-line { padding: 1px 0; }
        .log-line:hover { background: var(--line-soft); }

        /* ---- Toast ----------------------------------------------------- */

        .toast {
            position: fixed;
            bottom: var(--s5);
            right: var(--s5);
            max-width: min(380px, calc(100vw - 2 * var(--s5)));
            background: var(--surface-raised);
            border: 1px solid var(--line);
            padding: var(--s3) var(--s4);
            border-radius: var(--radius);
            box-shadow: 0 12px 32px -8px rgba(0,0,0,.5);
            z-index: 1000;
            transform: translateY(16px);
            opacity: 0;
            pointer-events: none;
            transition: transform .28s var(--ease), opacity .28s var(--ease);
        }
        .toast.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
        .toast.success { border-left: 3px solid var(--accent); }
        .toast.error { border-left: 3px solid var(--danger); }
        .toast.warning { border-left: 3px solid var(--orange); }

        footer {
            padding: var(--s5) 0;
            border-top: 1px solid var(--line-soft);
            color: var(--ink-faint);
            font-size: .85rem;
        }

        /* ---- Responsive ------------------------------------------------ */

        @media (max-width: 860px) {
            .container { padding-inline: var(--s4); }
            main { padding-block: var(--s5) var(--s7); }
            header .container {
                flex-wrap: wrap;
                padding-top: var(--s2);
                padding-bottom: var(--s2);
            }
            nav { width: 100%; order: 3; padding-bottom: var(--s1); }
            .theme-toggle { order: 2; }
        }

        @media (max-width: 560px) {
            .grid { grid-template-columns: 1fr; }
            .card { padding: var(--s4); }
            .toast { left: var(--s4); right: var(--s4); max-width: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .001ms !important;
                scroll-behavior: auto !important;
            }
        }

        @media print {
            header, footer, .toast, .btn { display: none; }
            .card { break-inside: avoid; box-shadow: none; }
        }
    </style>
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>

    <header>
        <div class="container">
            <a href="/" class="logo">Letterboxd <span>Toolkit</span></a>
            <nav aria-label="Primary">
                <a href="/" {% if request.url.path == "/" %}class="active" aria-current="page"{% endif %}>Dashboard</a>
                <a href="/actions" {% if request.url.path == "/actions" %}class="active" aria-current="page"{% endif %}>Actions</a>
                <a href="/films" {% if request.url.path == "/films" %}class="active" aria-current="page"{% endif %}>Films</a>
                <a href="/growth" {% if request.url.path == "/growth" %}class="active" aria-current="page"{% endif %}>Growth</a>
                <a href="/analytics" {% if request.url.path == "/analytics" %}class="active" aria-current="page"{% endif %}>Analytics</a>
                <a href="/metrics" {% if request.url.path == "/metrics" %}class="active" aria-current="page"{% endif %}>Metrics</a>
                <a href="/logs" {% if request.url.path == "/logs" %}class="active" aria-current="page"{% endif %}>Logs</a>
            </nav>
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark and light theme">
                <span id="theme-icon" aria-hidden="true">&#9790;</span>
            </button>
        </div>
    </header>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <main class="container" id="main">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">Letterboxd Toolkit — runs locally, stores nothing off this machine.</div>
    </footer>

    <script>
        // Three states: explicit dark, explicit light, or follow the system.
        // The old toggle wrote data-theme="" for dark, which could not
        // override a system light preference.
        function toggleTheme() {
            const root = document.documentElement;
            const current = root.getAttribute('data-theme')
                || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            const next = current === 'light' ? 'dark' : 'light';
            root.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeIcon(next);
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('theme-icon');
            if (icon) icon.innerHTML = theme === 'light' ? '&#9728;' : '&#9790;';
        }

        (function () {
            const saved = localStorage.getItem('theme');
            const theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            if (saved) document.documentElement.setAttribute('data-theme', saved);
            updateThemeIcon(theme);
        })();

        let toastTimer;
        function showToast(message, type = 'success', duration = 3000) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
        }

        async function triggerAction(endpoint, method = 'POST', body = null) {
            try {
                const options = { method, headers: { 'Content-Type': 'application/json' } };
                if (body) options.body = JSON.stringify(body);
                const response = await fetch(endpoint, options);
                const data = await response.json();

                if (response.ok) {
                    showToast(data.message || 'Action completed', 'success');
                    return data;
                }
                showToast(data.error || 'Action failed', 'error');
                return null;
            } catch (error) {
                showToast('Network error: ' + error.message, 'error');
                return null;
            }
        }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
